<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Doraemon bay trên nền trời và vòng nước xanh">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#79d4f2"/><stop offset=".55" stop-color="#c8eff8"/><stop offset="1" stop-color="#fff4f8"/></linearGradient>
    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#59c9ec"/><stop offset="1" stop-color="#1688bf"/></linearGradient>
    <linearGradient id="blue" x2=".7" y2="1"><stop stop-color="#34b8e7"/><stop offset="1" stop-color="#087bb8"/></linearGradient>
    <linearGradient id="white" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7f7fb"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="softShadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="14"/><feColorMatrix values="0 0 0 0 .10 0 0 0 0 .39 0 0 0 0 .55 0 0 0 .24 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cloudBlur"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <style>
    .cloud-a{animation:cloudDrift 30s ease-in-out infinite alternate}.cloud-b{animation:cloudDrift 37s ease-in-out -9s infinite alternate-reverse}
    .water-ring{transform-box:fill-box;transform-origin:center;animation:ringPulse 8s ease-in-out infinite}
    .doraemon{transform-box:fill-box;transform-origin:center;animation:float 5s ease-in-out infinite}
    .friend{transform-box:fill-box;transform-origin:center;animation:float 5.6s ease-in-out infinite}
    .nobita{animation-delay:-1.4s}.shizuka{animation-delay:-3.1s}.gian{animation-delay:-.8s}.suneo{animation-delay:-2.3s}
    .rotor{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:sparkle 3.5s ease-in-out infinite}.spark:nth-of-type(2n){animation-delay:-1.4s}
    .bell-light{animation:bell 2.8s ease-in-out infinite}
    @keyframes cloudDrift{from{transform:translateX(-18px)}to{transform:translateX(24px)}}
    @keyframes ringPulse{0%,100%{transform:scale(.98);opacity:.68}50%{transform:scale(1.035);opacity:.95}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-15px) rotate(1deg)}}
    @keyframes sparkle{0%,100%{opacity:.45;transform:scale(.78) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(18deg)}}
    @keyframes bell{0%,100%{opacity:.25}50%{opacity:.9}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
